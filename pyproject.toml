[project]
name = "zinvo-rahul"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1", # Schema(Table create/delete, Column add/delete, Index create/drop) migration tool for SQLAlchemy
    # alembic is old we can use flyway DB or liquibase for schema migration
    "bcrypt>=5.0.0",
    "boto>=2.49.0", # Aws (S3, RDS, DynamoDB, Bedrock) sdk for python
    "fastapi>=0.141.1", # Rest api framework
    "grpcio>=1.83.0", # gRPC implementation for Python
    "grpcio-tools>=1.83.0", # gRPC tools for Python
    "kafka>=1.3.5", # To connect with kafak
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "ruff>=0.16.4", # Linter for Python
    "sqlalchemy>=2.0.52", # db connection as well as curd operations Data: (insert, Update, Delete, Select)
    "uvicorn>=0.52.4", # web server to run fastapi/flask/django application
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in argument defaults is the required DI idiom, not a bug.
ignore = ["B008"]
